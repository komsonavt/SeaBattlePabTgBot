services:
  db:
    image: postgres:16-alpine
    container_name: seabattle-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-seabattle}
      POSTGRES_USER: ${POSTGRES_USER:-seabattle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-seabattle}
    volumes:
      - seabattle_pgdata:/var/lib/postgresql/data
    # Порт 5432 НЕ пробрасывается наружу — БД доступна только внутри Docker-сети
    # (бот подключается к db:5432). Для доступа с хоста раскомментируйте блок ниже:
    # ports:
    #   - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-seabattle} -d ${POSTGRES_DB:-seabattle}"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build: .
    container_name: seabattle-bot
    restart: unless-stopped
    volumes:
      - ${EMOJI_HOST_FILE:-./emoji.xml}:/app/emoji.xml:ro
      - ${BOT_CONFIG_HOST_FILE:-./bot.properties}:/app/config/bot.properties:ro
      - ${COPY_HOST_FILE:-./seaBattleBot_text_for_editor.md}:/app/copy.md:ro
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Непустые значения .env имеют приоритет; обычно настройки бота хранятся
      # в примонтированном bot.properties.
      BOT_TOKEN: ${BOT_TOKEN:-}
      BOT_USERNAME: ${BOT_USERNAME:-}
      MODERATION_CHAT_ID: ${MODERATION_CHAT_ID:-}
      MODERATION_TOPIC_ID: ${MODERATION_TOPIC_ID:-}
      EXPORTS_TOPIC_ID: ${EXPORTS_TOPIC_ID:-}
      BROADCASTS_TOPIC_ID: ${BROADCASTS_TOPIC_ID:-}
      ADMIN_IDS: ${ADMIN_IDS:-}
      GROUP_SIZE: ${GROUP_SIZE:-4}
      PLAYERS_PER_GROUP_ADVANCE: ${PLAYERS_PER_GROUP_ADVANCE:-2}
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-seabattle}
      DB_USER: ${POSTGRES_USER:-seabattle}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-seabattle}
      TURN_TIMEOUT_SECONDS: ${TURN_TIMEOUT_SECONDS:-180}
      EMOJI_FILE: /app/emoji.xml
      BOT_CONFIG_FILE: /app/config/bot.properties
      COPY_FILE: /app/copy.md

volumes:
  seabattle_pgdata:
